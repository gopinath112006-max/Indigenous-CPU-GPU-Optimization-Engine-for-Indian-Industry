name: HyperNova CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-cpu:
    name: CPU Build & Comprehensive CTest Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc-11, clang-14]

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libpthread-stubs0-dev

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DHYPERNOVA_BUILD_TESTS=ON \
          -DHYPERNOVA_BUILD_BENCHMARKS=ON

    - name: Build HyperNova System
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Execute Full CTest Suite (19 Targets)
      run: ctest --test-dir build --output-on-failure --parallel 4

    - name: Execute High-Scale Benchmark
      run: ./build/bin/scale_benchmark

    - name: Execute Industrial Demo Tiers
      run: ./build/bin/industrial_demo

  cuda-hardware-and-fallback-test:
    name: CUDA Backend Hardware & Fallback Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake (GPU Enabled)
      run: |
        cmake -B build-gpu -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DHYPERNOVA_ENABLE_CUDA=ON \
          -DHYPERNOVA_BUILD_TESTS=ON

    - name: Build GPU Target Backend
      run: cmake --build build-gpu --config Release --target test_gpu_backend

    - name: Verify CPU Fallback in Non-CUDA Environment
      run: ./build-gpu/bin/test_gpu_backend
